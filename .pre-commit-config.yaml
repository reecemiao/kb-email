# Install once:  uv run pre-commit install --install-hooks -t pre-commit -t pre-push
# Run on demand: uv run pre-commit run --all-files
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^kbmail/templates/workspace/_vscode/settings\.json$  # JSONC (comments allowed)
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
        exclude: ^kbmail/redact\.py$  # contains the regex that detects private keys

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.32
    hooks:
      - id: uv-lock  # keep uv.lock in sync with pyproject.toml

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run --frozen pytest -q
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-push]
